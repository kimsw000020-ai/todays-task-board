<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1120">
<title>Today's Task &amp; 근태 현황 · APTIV Proto Group</title>
<style>
:root{
  --bg:#0b1120;--panel:#111827;--panel2:#0f172a;--border:#1e293b;--border2:#334155;
  --text:#f1f5f9;--muted:#94a3b8;--dim:#64748b;
  --blue:#38bdf8;--indigo:#818cf8;--green:#34d399;--amber:#fbbf24;--red:#f87171;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;background:radial-gradient(1200px 500px at 15% -10%,#17255455,transparent),var(--bg);
  color:var(--text);font-family:-apple-system,"Pretendard","Malgun Gothic","Segoe UI",sans-serif;
  font-size:13.5px;line-height:1.5;font-variant-numeric:tabular-nums;
}
header{
  position:sticky;top:0;z-index:20;
  background:rgba(11,17,32,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:12px 16px;
}
.wrap{max-width:1220px;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#0ea5e9,#6366f1);
  display:grid;place-items:center;font-size:17px;box-shadow:0 4px 14px rgba(14,165,233,.3)
}
.brand h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.2px}
.brand small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.q, select.sel{
  background:var(--panel2);color:var(--text);border:1px solid var(--border2);
  border-radius:9px;padding:7px 12px;font-size:13px;outline:none;
}
input.q{width:230px;max-width:65vw}
input.q:focus, select.sel:focus{border-color:var(--blue)}
button.rf{
  background:var(--panel);color:var(--blue);border:1px solid var(--border2);
  border-radius:9px;padding:7px 13px;font-weight:700;cursor:pointer;font-size:12.5px;
}
button.rf:hover{background:#1e293b}

main{padding:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{
  background:var(--panel);color:var(--muted);border:1px solid var(--border);
  border-radius:99px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;
}
.tab.on{background:rgba(56,189,248,.14);color:var(--blue);border-color:rgba(56,189,248,.45)}

.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.card{
  background:linear-gradient(180deg,#111827,#0f172a);
  border:1px solid var(--border);border-radius:14px;padding:15px;
  box-shadow:0 8px 24px rgba(0,0,0,.22);
}
.card h2{
  margin:0 0 12px;font-size:14px;font-weight:800;color:#f8fafc;
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
}
.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center;align-items:center}
.gauge{display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.gauge .gwrap{position:relative;width:100%;max-width:112px;aspect-ratio:1/1;margin:0 auto}
.gauge .gval{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:15px;font-weight:800;color:#f8fafc;
}
.gauge .glbl{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:700}

.stk{margin-bottom:11px}.stk:last-child{margin-bottom:0}
.stk-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.stk-top span{color:var(--muted)}.stk-top b{color:var(--text)}
.stk-bar{height:9px;background:#1e293b;border-radius:99px;overflow:hidden;display:flex;gap:1px}
.stk-bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:10px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

.wrow{display:grid;grid-template-columns:72px 1fr 48px;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.wrow:last-child{margin-bottom:0}
.wname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cbd5e1;font-weight:600}
.wtrack{height:8px;background:#1e293b;border-radius:99px;overflow:hidden}
.wtrack i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#0ea5e9,#818cf8)}
.wcnt{text-align:right;color:var(--blue);font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#0b1220;border:1px solid #1e293b;border-radius:10px;padding:9px 6px;text-align:center}
.kpi b{display:block;font-size:17px;color:var(--blue);font-weight:800}
.kpi i{font-style:normal;font-size:10.5px;color:var(--muted)}

.list{display:flex;flex-direction:column;gap:9px}
.tcard{
  background:#0b1220;border:1px solid #1e293b;border-left:3px solid var(--blue);
  border-radius:10px;padding:10px 12px;transition:border-color .15s,background .15s;
}
.tcard.p0{border-left-color:var(--red)}
.tcard.p1{border-left-color:var(--amber)}
.tcard.ok{border-left-color:var(--green)}
.tcard.clk{cursor:pointer}.tcard.clk:hover{background:#131d33}
.tcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ttitle{font-weight:700;font-size:13.2px;color:#f8fafc;line-height:1.4;word-break:keep-all}
.meta{
  display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:7px;
  font-size:11.5px;color:var(--muted);align-items:center;
}
.chip{display:inline-flex;align-items:center;gap:4px;background:#172033;padding:2px 8px;border-radius:6px;color:#cbd5e1}
.tag{
  display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;
  background:#1e3a5f;color:#7dd3fc;white-space:nowrap;flex-shrink:0;
}
.tag.r{background:#4c1d24;color:#fca5a5}
.tag.g{background:#0f3b2e;color:#6ee7b7}
.tag.y{background:#4a3410;color:#fcd34d}
.pbar{height:5px;background:#1e293b;border-radius:99px;overflow:hidden;margin-top:8px}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,#34d399)}

.sys-ul{margin:6px 0 0;padding-left:16px;color:#cbd5e1;font-size:12px}
.sys-ul li{margin-bottom:3px}

/* Attendance detail table & chart */
.drow{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-top:1px solid #1e293b;font-size:12.5px}
.drow:first-child{border-top:0}
.svgbox{width:100%;overflow-x:auto;margin:8px 0 12px}
.empty{color:var(--dim);text-align:center;padding:18px;font-size:12.5px}
.err{color:#fca5a5;background:#4c1d2433;border:1px solid #7f1d1d;border-radius:10px;padding:14px}
footer{max-width:1220px;margin:10px auto 26px;padding:0 16px;color:var(--dim);font-size:11.5px;text-align:center}
.proto-c-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.imds-q-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:600px){
  .proto-c-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .imds-q-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .ctrl{width:100%}
  .card,.tcard{min-width:0;max-width:100%}
  .ttitle{word-break:break-word;overflow-wrap:anywhere}
  body{font-size:10.5px;line-height:1.35}
  header{padding:6px 9px}
  .hdr{gap:6px}
  .brand{gap:7px}
  .logo{width:24px;height:24px;font-size:12px;border-radius:7px}
  .brand h1{font-size:12.5px}
  .brand small{font-size:9px}
  .ctrl{gap:5px}
  input.q,select.sel{width:100%;max-width:none;flex:1;padding:5px 8px;font-size:10.5px;border-radius:7px}
  button.rf{padding:5px 8px;font-size:10.5px;border-radius:7px}
  main{padding:7px}
  .tabs{gap:4px;margin-bottom:8px}
  .tab{padding:3.5px 8px;font-size:10px}
  .grid,.charts{grid-template-columns:1fr;gap:8px;margin-bottom:10px}
  .card{padding:8px 9px;border-radius:10px}
  .card h2{font-size:11.5px;margin-bottom:7px}
  .gauge .gwrap{max-width:92px}
  .gauge .gval{font-size:12.5px}
  .gauge .glbl{font-size:10px;margin-top:4px}
  .stk{margin-bottom:7px}
  .stk-top,.wrow,.legend{font-size:9.5px}
  .stk-bar,.wtrack{height:6px}
  .wrow{grid-template-columns:50px 1fr 34px;gap:5px;margin-bottom:5px}
  .kpis{gap:5px;margin-bottom:7px}
  .kpi{padding:5px 3px;border-radius:7px}
  .kpi b{font-size:12.5px}
  .kpi i{font-size:8.5px}
  .list{gap:6px}
  .tcard{padding:6px 8px;border-radius:8px}
  .ttitle{font-size:11px;line-height:1.3}
  .meta{gap:3px 5px;margin-top:4px;font-size:9.5px}
  .chip{padding:1px 5px;font-size:9.5px;border-radius:4px}
  .tag{font-size:8.5px;padding:1px 5px}
  .pbar{height:4px;margin-top:5px}
  .sys-ul{font-size:10px;padding-left:13px;margin-top:4px}
  .drow{font-size:10px;padding:5px 2px}
  .svgbox svg{height:115px !important;min-width:300px !important}
  footer{font-size:9.5px;margin:6px auto 16px}
}
</style>
</head>
<body>
<header>
  <div class="wrap hdr">
    <div class="brand">
      <div class="logo">✅</div>
      <div>
        <h1>Today's Task &amp; 근태 현황</h1>
        <small id="upd">데이터 불러오는 중…</small>
      </div>
    </div>
    <div class="ctrl">
      <input class="q" id="q" type="search" placeholder="품명, 담당자, 사원명, P0 검색…" oninput="render()">
      <button class="rf" onclick="load()">🔄 새로고침</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tabs" id="tabs">
    <button class="tab on" data-f="all">✅ Today's Task</button>
    <button class="tab" data-f="proto">🏭 Proto Shop</button>
    <button class="tab" data-f="measure">📐 Measurement</button>
    <button class="tab" data-f="imds">🖥️ IMDS/CAMDS</button>
    <button class="tab" data-f="system">📌 System</button>
    <button class="tab" data-f="attendance">⏱️ 근태 Analytics Pro</button>
  </div>
  <section class="charts" id="charts"></section>
  <section class="grid" id="app"></section>
  <section id="attDetWrap" style="margin-top:14px"></section>
</main>

<footer>APTIV Proto Group · Today's Task &amp; 근태 현황 Snapshot</footer>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=null, ATT=null, FILTER='all', ATT_MONTH=null, ATT_EMP=null, ATT_DEPT='all';
const TEAM_DEPT={
  '김성훈':'Proto Shop','박동근':'Proto Shop','장은주':'Proto Shop','서민숙':'Proto Shop','이은순':'Proto Shop','정성호':'Proto Shop(GP)',
  '김예경':'측정','박성우':'측정','김선진':'측정',
  '김승영':'System','이상진':'System',
  '김성웅':'총괄'
};
function deptOf(n){return TEAM_DEPT[(n||'').trim()]||'';}
function deptBadge(n){
  const d=deptOf(n); if(!d)return '';
  const c=d.startsWith('Proto')?'':d==='측정'?'g':d==='총괄'?'y':'';
  return `<span class="tag ${c}">${esc(d)}</span>`;
}

document.querySelectorAll('#tabs .tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); FILTER=b.dataset.f;
  $('#attDetWrap').innerHTML='';
  render();
});

function priInfo(p){
  const s=String(p??'');
  if(/^(0|P0)/i.test(s))return {cls:'p0',badge:'<span class="tag r">P0 긴급</span>'};
  if(/^(1|P1)/i.test(s))return {cls:'p1',badge:'<span class="tag y">P1 우선</span>'};
  return {cls:'',badge:''};
}
function dueTag(d){
  if(!d)return '';
  const today=new Date().toISOString().slice(0,10);
  if(/^\d{4}-\d{2}-\d{2}$/.test(d) && d<today) return `<span class="tag r">⏰ ${esc(d)} 지연</span>`;
  return `<span class="chip">⏰ ${esc(d)}</span>`;
}
function match(obj,kw){
  if(!kw)return true;
  return Object.values(obj).some(v=>String(v??'').toLowerCase().includes(kw));
}

function gaugeSvg(pct,color,label){
  const v=Math.max(0,Math.min(100,+pct||0)), r=31, c=2*Math.PI*r, off=c*(1-v/100);
  return `<div class="gauge">
    <div class="gwrap">
      <svg viewBox="0 0 76 76">
        <circle cx="38" cy="38" r="${r}" fill="none" stroke="#1e293b" stroke-width="7"/>
        <circle cx="38" cy="38" r="${r}" fill="none" stroke="${color}" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
      </svg>
      <div class="gval">${v.toFixed(1)}%</div>
    </div>
    <div class="glbl">${label}</div>
  </div>`;
}
function stkBar(title,right,segs){
  const tot=Math.max(segs.reduce((a,s)=>a+(+s[0]||0),0),1);
  return `<div class="stk">
    <div class="stk-top"><span>${title}</span><b>${right}</b></div>
    <div class="stk-bar">${segs.map(s=>`<i style="width:${((+s[0]||0)/tot*100).toFixed(1)}%;background:${s[1]}"></i>`).join('')}</div>
  </div>`;
}

function renderTaskCharts(){
  const p=DATA.proto_shop||{},m=DATA.measurement||{},i=DATA.imds||{};
  const ps=p.stats||{},ms=m.stats||{},is=i.stats||{};
  const owners={};
  const addO=n=>{n=(n||'미지정').trim();owners[n]=(owners[n]||0)+1;};
  (p.today_tasks||[]).forEach(x=>addO(x.worker));
  (m.today_tasks||[]).forEach(x=>addO(x.owner));
  (i.today_tasks||[]).forEach(x=>addO(x.pe_owner));
  const topO=Object.entries(owners).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxO=Math.max(...topO.map(x=>x[1]),1);
  const totalToday=(p.today_tasks?.length||0)+(m.today_tasks?.length||0)+(i.today_tasks?.length||0);

  $('#charts').innerHTML=`
    <div class="card">
      <h2><span>📊 부문별 핵심 달성률</span><span class="tag g">KPI</span></h2>
      <div class="gauges">
        ${gaugeSvg(ps.overall_achievement_rate,'#38bdf8','Proto 달성률')}
        ${gaugeSvg(ms.pass_rate,'#34d399','측정 합격률')}
        ${gaugeSvg(is.completion_rate,'#818cf8','IMDS 완료율')}
      </div>
    </div>
    <div class="card">
      <h2><span>👥 금일 중점 업무 분포</span><span class="tag">총 ${totalToday}건</span></h2>
      ${topO.length?topO.map(([name,cnt])=>`
        <div class="wrow">
          <div class="wname" title="${esc(name)}">${esc(name)}</div>
          <div class="wtrack"><i style="width:${(cnt/maxO*100).toFixed(0)}%"></i></div>
          <div class="wcnt">${cnt}건</div>
        </div>`).join(''):'<div class="empty">집계 없음</div>'}
    </div>
    ${renderProtoChart(p.chart, ps)}
    ${renderBacklogChart(m.backlog_trend, ms)}
    ${renderImdsQuarterlyChart(i.quarterly_summary)}
    ${renderCmdtMonthlyChart(DATA.cmdt)}`;
}

function renderCmdtMonthlyChart(cm){
  if(!cm || !Array.isArray(cm.month_labels) || !cm.month_labels.length) return '';
  const lbs=cm.month_labels, plants=cm.plants||[], ser=cm.series_by_plant||{}, tots=cm.monthly_totals||[], pt=cm.plant_totals||{}, cs=cm.stats||{};
  const cols=['#38bdf8','#22d3ee','#a78bfa','#34d399','#fbbf24','#f472b6','#f87171','#94a3b8'];
  const mx=Math.max(...tots,1);
  return `<div class="card">
    <h2><span>📈 CMDT 월별 등록 추이 (공장별 · 2026Y)</span><span class="tag">누적 ${(cs.total_2026_count??0).toLocaleString()}건</span></h2>
    <div style="display:flex;align-items:flex-end;gap:5px;height:100px;padding:10px 4px 20px;background:#0b1220;border:1px solid #1e293b;border-radius:8px;overflow-x:auto">
      ${lbs.map((lb,idx)=>{const tot=tots[idx]||0,h=Math.max(4,Math.round(tot/mx*64));
        return `<div style="flex:1;min-width:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative" title="${esc(lb)} 총 ${tot}건">
          <span style="font-size:9px;color:#cbd5e1;font-weight:700;margin-bottom:2px">${tot}</span>
          <div style="width:14px;height:${h}px;display:flex;flex-direction:column-reverse;border-radius:2px 2px 0 0;overflow:hidden">
            ${plants.map((pl,pi)=>{const v=(ser[pl]||[])[idx]||0;if(!v)return '';const sh=Math.max(1,Math.round(v/Math.max(tot,1)*h));return `<div title="Plant ${esc(pl)}: ${v}건" style="height:${sh}px;background:${cols[pi%cols.length]}"></div>`;}).join('')}
          </div>
          <span style="position:absolute;bottom:-16px;font-size:9.5px;color:#94a3b8">${esc(lb)}</span>
        </div>`;}).join('')}
    </div>
    <div class="legend">${plants.map((pl,pi)=>`<span><i class="dot" style="background:${cols[pi%cols.length]}"></i>${esc(pl)} (${pt[pl]||0})</span>`).join('')}</div>
  </div>`;
}

function renderProtoChart(c, ps){
  if(!c || !Array.isArray(c.labels) || !c.labels.length) return '';
  const rows=c.labels.slice(0,6).map((lb,idx)=>({
    lb,
    pl:(c.plan_qty||[])[idx]||0,
    pr:(c.prod_qty||[])[idx]||0,
    rt:(c.rates||[])[idx]||0
  }));
  const mx=Math.max(...rows.map(r=>Math.max(r.pl,r.pr)),1);
  return `<div class="card">
    <h2><span>⚡ 시작실 주요 과제 계획 vs 실적</span><span class="tag">전체 달성률 ${ps.overall_achievement_rate??'-'}%</span></h2>
    ${rows.map(r=>{
      const barCol=r.rt>=100?'#34d399':(r.rt>=70?'#38bdf8':'#fbbf24');
      const pw=Math.min(100,Math.round(r.pl/mx*100));
      const aw=Math.min(100,Math.round(r.pr/mx*100));
      return `<div class="wrow" style="grid-template-columns:86px 1fr 78px" title="${esc(r.lb)}: 실적 ${r.pr.toLocaleString()} / 계획 ${r.pl.toLocaleString()} (${r.rt}%)">
        <div class="wname">${esc(r.lb)}</div>
        <div class="wtrack" style="position:relative;height:10px;background:#0b1220;border:1px solid #1e293b">
          <div style="position:absolute;inset:0;width:${pw}%;background:#334155;border-radius:99px"></div>
          <div style="position:relative;width:${aw}%;height:100%;background:${barCol};border-radius:99px"></div>
        </div>
        <div class="wcnt" style="color:${barCol};font-size:10.5px">${r.pr.toLocaleString()}/${r.pl.toLocaleString()} <span style="opacity:.85">(${r.rt}%)</span></div>
      </div>`;
    }).join('')}
    <div class="legend">
      <span><i class="dot" style="background:#334155"></i>계획 (Plan)</span>
      <span><i class="dot" style="background:#38bdf8"></i>실적 (Prod)</span>
      <span>총 ${(ps.total_prod_qty||0).toLocaleString()} / ${(ps.total_plan_qty||0).toLocaleString()} EA</span>
    </div>
  </div>`;
}

function renderImdsQuarterlyChart(q){
  if(!q || !Array.isArray(q.quarters) || !q.quarters.length) return '';
  const tot=q.total||{}, qs=q.quarters;
  const rec=q.receipt||[], done=q.completed_total||[], ong=q.ongoing||[];
  const W=340, H=132, Px=28, Py=22, bot=H-22;
  const mxBar=Math.max(...rec, ...done, 1);
  const mxOng=Math.max(...ong, 1);
  const step=(W-Px*2)/qs.length;
  const bw=16;
  const pts=qs.map((qt,idx)=>{
    const cx=Px+step*idx+step/2;
    const rV=rec[idx]||0, dV=done[idx]||0, oV=ong[idx]||0;
    const rH=Math.max(4, Math.round((rV/mxBar)*(bot-Py)));
    const dH=Math.max(4, Math.round((dV/mxBar)*(bot-Py)));
    const oY=bot - ((oV/mxOng)*(bot-Py-14));
    return {qt, cx, rV, dV, oV, rH, dH, oY};
  });
  const oLine=pts.map(p=>`${p.cx.toFixed(1)},${p.oY.toFixed(1)}`).join(' ');
  return `<div class="card">
    <h2><span>🌿 IMDS 분기별 실적 &amp; 잔여 (2026Y)</span><span class="tag y">Q4 잔여 ${tot.ongoing??31}건 · 완료 ${tot.completion_rate??97.8}%</span></h2>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:132px;background:#0b1220;border-radius:10px;border:1px solid #1e293b">
      ${pts.map(p=>`
        <rect x="${(p.cx-bw-2).toFixed(1)}" y="${(bot-p.rH).toFixed(1)}" width="${bw}" height="${p.rH}" rx="2" fill="#38bdf8" opacity="0.85"/>
        <text x="${(p.cx-bw/2-2).toFixed(1)}" y="${(bot-p.rH-3).toFixed(1)}" text-anchor="middle" fill="#7dd3fc" font-size="8.5" font-weight="700">${p.rV}</text>
        <rect x="${(p.cx+2).toFixed(1)}" y="${(bot-p.dH).toFixed(1)}" width="${bw}" height="${p.dH}" rx="2" fill="#34d399" opacity="0.88"/>
        <text x="${(p.cx+bw/2+2).toFixed(1)}" y="${(bot-p.dH-3).toFixed(1)}" text-anchor="middle" fill="#6ee7b7" font-size="8.5" font-weight="700">${p.dV}</text>
        <text x="${p.cx.toFixed(1)}" y="${H-6}" text-anchor="middle" fill="#cbd5e1" font-size="10" font-weight="800">${esc(p.qt)}</text>
      `).join('')}
      <polyline fill="none" stroke="#fb923c" stroke-width="2" points="${oLine}"/>
      ${pts.map(p=>`
        <circle cx="${p.cx.toFixed(1)}" cy="${p.oY.toFixed(1)}" r="3.5" fill="#fb923c" stroke="#0b1220" stroke-width="1.2"/>
        <text x="${p.cx.toFixed(1)}" y="${(p.oY-6).toFixed(1)}" text-anchor="middle" fill="#fdba74" font-size="8.5" font-weight="800">잔여 ${p.oV}</text>
      `).join('')}
    </svg>
    <div class="legend">
      <span><i class="dot" style="background:#38bdf8"></i>접수 (${(tot.receipt??1415).toLocaleString()})</span>
      <span><i class="dot" style="background:#34d399"></i>완료 (${(tot.completed_total??1384).toLocaleString()})</span>
      <span><i class="dot" style="background:#fb923c"></i>이월 잔여 (Q4 ${tot.ongoing??31}건)</span>
    </div>
  </div>`;
}

function renderBacklogChart(bt, ms){
  if(!bt || !Array.isArray(bt.chart_labels)) return '';
  const pts=[];
  for(let i=0;i<bt.chart_labels.length;i++){
    if(bt.chart_data && bt.chart_data[i]!=null){
      pts.push({lbl:bt.chart_labels[i], val:+bt.chart_data[i], done:+(bt.chart_done?.[i]||0)});
    }
  }
  const view=pts.slice(-12);
  if(!view.length) return '';
  const W=340, H=122, Px=18, Py=20, bot=H-18;
  const vals=view.map(x=>x.val);
  const mx=Math.max(...vals, 1), mn=Math.max(0, Math.min(...vals)-3);
  const span=Math.max(mx-mn, 1);
  const mxDone=Math.max(...view.map(x=>x.done), 1);
  const coords=view.map((x,i)=>{
    const cx=Px+(view.length>1?i/(view.length-1)*(W-Px*2):(W-Px*2)/2);
    const cy=bot-((x.val-mn)/span*(bot-Py));
    const dh=x.done>0 ? Math.max(4, Math.round((x.done/mxDone)*((bot-Py)*0.55))) : 0;
    return {cx, cy, dh, ...x};
  });
  const bw=Math.max(8, Math.min(16, Math.floor((W-Px*2)/Math.max(view.length,1)*0.5)));
  const line=coords.map(c=>`${c.cx.toFixed(1)},${c.cy.toFixed(1)}`).join(' ');
  const area=`${coords[0].cx.toFixed(1)},${bot} ${line} ${coords[coords.length-1].cx.toFixed(1)},${bot}`;
  const cur=bt.today_pending ?? ms.total_active_queue ?? view[view.length-1].val;
  return `<div class="card">
    <h2><span>📐 잔여 측정 건수 추이</span><span class="tag y">잔여 ${cur}건 · 완료 ${bt.completion_rate??'-'}%</span></h2>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:122px;background:#0b1220;border-radius:10px;border:1px solid #1e293b">
      ${coords.map(c=>c.dh>0?`
        <rect x="${(c.cx-bw/2).toFixed(1)}" y="${(bot-c.dh).toFixed(1)}" width="${bw}" height="${c.dh}" rx="2" fill="rgba(56,189,248,0.42)" stroke="#38bdf8" stroke-width="0.6"/>
        <text x="${c.cx.toFixed(1)}" y="${(bot-c.dh-2).toFixed(1)}" text-anchor="middle" fill="#7dd3fc" font-size="7.5" font-weight="700">${c.done}</text>
      `:'').join('')}
      <polygon fill="rgba(251,191,36,0.12)" points="${area}"/>
      <polyline fill="none" stroke="#fbbf24" stroke-width="2" points="${line}"/>
      ${coords.map((c,idx)=>`
        <circle cx="${c.cx.toFixed(1)}" cy="${c.cy.toFixed(1)}" r="3" fill="#fbbf24"/>
        <text x="${c.cx.toFixed(1)}" y="${(c.cy-6).toFixed(1)}" text-anchor="middle" fill="#fde68a" font-size="8.5" font-weight="700">${c.val}</text>
        ${idx===0||idx===coords.length-1||idx%2===0?`<text x="${c.cx.toFixed(1)}" y="${H-4}" text-anchor="middle" fill="#64748b" font-size="8.5">${esc(c.lbl)}</text>`:''}
      `).join('')}
    </svg>
    <div class="legend">
      <span><i class="dot" style="background:#fbbf24"></i>일별 잔여 건수</span>
      <span><i class="dot" style="background:#38bdf8"></i>일별 측정 건수</span>
      <span>완료 ${bt.completed_count??'-'} / 전체 ${bt.total_requests??ms.total_requests??'-'}건</span>
    </div>
  </div>`;
}

function showAttDetail(emp, noScroll){
  ATT_EMP=emp;
  const d=(ATT.details[ATT_MONTH]||{})[emp];
  if(!d){$('#attDetWrap').innerHTML='';return;}
  const co=Math.min(d.cutoff_day||d.days.length, d.days.length);
  const maxCum=Math.max(...d.cum_hours.slice(0,co), ...d.cum_base.slice(0,co), 1);
  const W=620, H=165, Px=26, Py=22, plotW=W-Px*2, plotH=H-Py*2;
  const step=co>0?plotW/co:plotW;
  const barW=Math.max(4, Math.min(18, step*0.65));
  const xCenter=(idx)=>Px+step*idx+step/2;
  const yVal=(v)=>H-Py-(v/maxCum*plotH);
  const bars=d.cum_hours.slice(0,co).map((v,idx)=>{
    const x=xCenter(idx)-barW/2;
    const y=yVal(v);
    const h=Math.max(1, (H-Py)-y);
    const ok=v>=(d.cum_base[idx]||0);
    const fill=ok?'#38bdf8':'#f87171';
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${fill}" fill-opacity="0.82"><title>${d.days[idx]}일 · 실근무 누적 ${v}h / 기준 ${d.cum_base[idx]}h</title></rect>`;
  }).join('');
  const basePts=d.cum_base.slice(0,co).map((v,idx)=>`${xCenter(idx).toFixed(1)},${yVal(v).toFixed(1)}`).join(' ');
  const xTicks=d.days.slice(0,co).map((day,idx)=>{
    if(idx===0||idx===co-1||idx%Math.max(1,Math.floor(co/8))===0){
      return `<text x="${xCenter(idx).toFixed(1)}" y="${H-6}" text-anchor="middle" fill="#64748b" font-size="9">${day}일</text>`;
    }
    return '';
  }).join('');

  let rows='';
  for(let i=0;i<co;i++){
    const a=d.actual_work[i], al=d.alt_leave[i], an=d.annual_leave[i], hol=d.holiday_flags[i];
    if(!a&&!al&&!an&&hol) continue;
    rows+=`<div class="drow">
      <span><b>${d.days[i]}일</b> ${hol?'<span class="tag r">휴일</span>':''} ${an?'<span class="tag g">연차 '+an+'h</span>':''} ${al?'<span class="tag y">대체 '+al+'h</span>':''}</span>
      <span>실근무 <b>${a}h</b> · 누적 ${d.cum_hours[i]}h <span class="tag ${d.diff_hours[i]>=0?'g':'r'}">${d.diff_hours[i]>=0?'+':''}${d.diff_hours[i]}h</span></span>
    </div>`;
  }
  $('#attDetWrap').innerHTML=`
    <section class="card">
      <h2>
        <span>👤 ${esc(emp)} 일별 근태 상세 (${esc(ATT_MONTH)})</span>
        <button class="rf" onclick="ATT_EMP=null;$('#attDetWrap').innerHTML=''">닫기</button>
      </h2>
      <div class="kpis">
        <div class="kpi"><b>${d.cum_hours[co-1]}h</b><i>누적 실근무</i></div>
        <div class="kpi"><b>${d.cum_base[co-1]}h</b><i>누적 기준</i></div>
        <div class="kpi"><b style="color:${d.diff_hours[co-1]>=0?'var(--green)':'var(--red)'}">${d.diff_hours[co-1]>=0?'+':''}${d.diff_hours[co-1]}h</b><i>과부족</i></div>
      </div>
      <div class="svgbox" style="overflow-x:hidden">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;min-width:0;height:auto;max-height:175px;background:#0b1220;border-radius:10px;border:1px solid #1e293b">
          <line x1="${Px}" y1="${(Py+plotH/2).toFixed(1)}" x2="${W-Px}" y2="${(Py+plotH/2).toFixed(1)}" stroke="#1e293b" stroke-dasharray="2 3"/>
          <line x1="${Px}" y1="${H-Py}" x2="${W-Px}" y2="${H-Py}" stroke="#334155"/>
          <text x="${Px-4}" y="${Py+4}" text-anchor="end" fill="#64748b" font-size="8.5">${Math.round(maxCum)}h</text>
          <text x="${Px-4}" y="${(Py+plotH/2+3).toFixed(1)}" text-anchor="end" fill="#64748b" font-size="8.5">${Math.round(maxCum/2)}h</text>
          ${bars}
          <polyline fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-dasharray="5 3" points="${basePts}"/>
          ${xTicks}
        </svg>
        <div class="legend">
          <span><i class="dot" style="background:#38bdf8"></i>누적 실근무 (기준 충족)</span>
          <span><i class="dot" style="background:#f87171"></i>누적 실근무 (기준 미달)</span>
          <span><i class="dot" style="background:#fbbf24"></i>누적 기준 (점선)</span>
        </div>
      </div>
      <div>${rows||'<div class="empty">기록 없음</div>'}</div>
    </section>`;
  if(!noScroll) $('#attDetWrap').scrollIntoView({behavior:'smooth'});
}

          <div class="kpi"><b>${(cs.latest_month_count??0).toLocaleString()}</b><i>${esc(cs.latest_month||'최근월')}</i></div>
        </div>
        <div class="list">${tops.length?tops.map(x=>`<div class="tcard">
          <div class="tcard-top"><div class="ttitle">${esc(x.part_no)}${x.part_desc?' · '+esc(x.part_desc):''}</div><span class="tag ${x.source==='AS'?'':'y'}">${esc(x.source)} · ${esc(x.plant)}</span></div>
          <div class="meta"><span class="chip">🏭 Plant ${esc(x.plant)}</span>${x.pe_owner?`<span class="chip">👤 ${esc(x.pe_owner)}</span>`:''}<span class="chip">📅 ${esc(x.reg_date)}</span></div>
        </div>`).join(''):'<div class="empty">최근 등록 항목 없음</div>'}</div>
      </section>`;
    })();

  if(FILTER==='all'||FILTER==='system'){
    const doms=(sy.domains||[]).filter(x=>match(x,kw));
    html+=`<section class="card">
      <h2><span>📌 System 현황 (SAP · VAVE · IMDS)</span><span class="tag">${doms.length}건</span></h2>
      <div class="list">${doms.length?doms.map(x=>{
        const lines=String(x.actions||'').split(/\s+-\s+|\n/).map(s=>s.replace(/^[\s\-\.]+/,'').trim()).filter(Boolean).slice(0,5);
        return `<div class="tcard">
          <div class="tcard-top"><div class="ttitle">${esc(x.name)}</div><span class="tag g">${esc(x.status)}</span></div>
          ${lines.length?`<ul class="sys-ul">${lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}
        </div>`;
      }).join(''):'<div class="empty">표시할 항목이 없습니다.</div>'}</div>
    </section>`;
  }
  $('#app').innerHTML=html;
}

async function load(){
  try{
    const [tr, ar]=await Promise.all([
      fetch('./tasks.json?t='+Date.now(),{cache:'no-store'}),
      fetch('./attendance.json?t='+Date.now(),{cache:'no-store'}).catch(()=>null)
    ]);
    if(!tr.ok)throw new Error('tasks.json HTTP '+tr.status);
    DATA=await tr.json();
    if(ar && ar.ok) ATT=await ar.json();
    $('#upd').textContent='기준 시각: '+(DATA.timestamp||'-');
    render();
  }catch(e){
    $('#app').innerHTML=`<div class="err">⚠️ 데이터를 불러오지 못했습니다: ${esc(e.message)}</div>`;
  }
}
load();
</script>
</body>
</html>
